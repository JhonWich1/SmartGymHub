<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nealtican Gym - Display TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>

  <header>
    <div class="brand">NEALTICAN GYM</div>
    <div class="header-right">
      <div class="clock-display" id="liveClock">00:00 AM</div>
      <div class="tv-badge" id="tvNameDisplay">CARGANDO...</div>
    </div>
  </header>

  <div class="main-container">
    <!-- Panel Izquierdo: Video Silencioso Autoplay -->
    <div class="neu-panel video-card">
      <div class="video-container">
        <!-- 'muted' permite reproducir video automáticamente sin interacción previa -->
        <video id="gymVideoPlayer" autoplay playsinline muted></video>
      </div>

      <div class="song-info-footer">
        <img id="songThumbnail" src="https://via.placeholder.com/50" class="song-cover" alt="Portada" />
        <div class="song-text-details">
          <div class="song-artist" id="songArtist">SONANDO EN EL GYM</div>
          <div class="song-title-single" id="currentSongTitle">Esperando canción...</div>
        </div>
      </div>
    </div>

    <!-- Panel Derecho: Cola Compacta -->
    <div class="neu-panel queue-card">
      <div class="queue-title">
        <span>Próximas en Fila</span>
        <span id="queueCount" style="font-size: 0.8rem; color: var(--text-muted);">(0)</span>
      </div>
      <ul class="queue-list" id="musicQueueList">
        <li style="color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No hay canciones en cola</li>
      </ul>
    </div>
  </div>

  <script>
    const socket = io();
    const videoPlayer = document.getElementById('gymVideoPlayer');
    const pathname = window.location.pathname.toLowerCase();
    const tvId = pathname.includes('tv2') ? 'tv2' : 'tv1';

    document.getElementById('tvNameDisplay').innerText = 
      tvId === 'tv1' ? 'TV 1 - PESOS LIBRES' : 'TV 2 - MÁQUINAS';

    // Reloj digital en vivo
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Actualizar video e información cuando cambia la canción activa
    socket.on('song-changed', (data) => {
      document.getElementById('currentSongTitle').innerText = data.title;
      document.getElementById('songArtist').innerText = data.artist || 'NEALTICAN GYM';
      
      if (data.thumbnail) {
        document.getElementById('songThumbnail').src = data.thumbnail;
      }

      if (data.videoUrl) {
        videoPlayer.src = data.videoUrl;
        videoPlayer.play().catch(err => console.error('Error al reproducir video:', err));
      } else {
        videoPlayer.removeAttribute('src');
      }
    });

    // Actualizar lista en pantalla
    socket.on('update-music-queue', (queue) => {
      const queueList = document.getElementById('musicQueueList');
      document.getElementById('queueCount').innerText = `(${queue.length})`;
      queueList.innerHTML = '';

      if (queue.length === 0) {
        queueList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No hay canciones en cola</li>';
        return;
      }

      queue.forEach((song) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerHTML = `
          <img class="queue-thumb" src="${song.thumbnail || 'https://via.placeholder.com/40'}" alt="thumb" />
          <div class="queue-info">
            <div class="queue-song-title">${song.title}</div>
            <div class="queue-song-artist">${song.artist}</div>
          </div>
        `;
        queueList.appendChild(li);
      });
    });
  </script>
</body>
</html>
