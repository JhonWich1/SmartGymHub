<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nealtican Gym - Display TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    #audioUnlocker {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(18, 18, 18, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--accent-yellow);
      cursor: pointer;
    }
    
    /* Repro de video estilizado */
    .video-container {
      width: 100%;
      max-height: 380px;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .song-cover {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      margin-right: 15px;
      border: 2px solid var(--accent-yellow);
    }

    .song-info-group {
      display: flex;
      align-items: center;
      text-align: left;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="audioUnlocker">
    <h1 style="font-size: 3rem; margin-bottom: 15px;">🔊 NEALTICAN GYM</h1>
    <p style="font-size: 1.4rem; color: #ffffff;">Haz clic aquí para activar audio y video</p>
  </div>

  <header>
    <div class="brand">NEALTICAN GYM</div>
    <div class="tv-badge" id="tvNameDisplay">CARGANDO...</div>
  </header>

  <div class="main-container">
    <!-- Panel Principal con Reproductor de Video -->
    <div class="neu-panel music-player-card" style="justify-content: flex-start;">
      
      <div class="video-container">
        <video id="gymVideoPlayer" autoplay playsinline></video>
      </div>

      <div class="song-info-group">
        <img id="songThumbnail" src="https://via.placeholder.com/80" class="song-cover" alt="Portada" />
        <div>
          <div class="song-status" id="songArtist">SONANDO EN EL GYM</div>
          <div class="song-title" id="currentSongTitle" style="font-size: 1.3rem;">Esperando canción...</div>
        </div>
      </div>

    </div>

    <!-- Lista de Espera -->
    <div class="neu-panel music-queue-card">
      <div class="queue-title">Próximas en Fila</div>
      <ul class="queue-list" id="musicQueueList">
        <li class="queue-item">No hay canciones en cola</li>
      </ul>
    </div>
  </div>

  <script>
    const socket = io();
    const videoPlayer = document.getElementById('gymVideoPlayer');
    const pathname = window.location.pathname.toLowerCase();
    const tvId = pathname.includes('tv2') ? 'tv2' : 'tv1';

    document.getElementById('tvNameDisplay').innerText = 
      tvId === 'tv1' ? 'TV 1 - ZONA PESOS LIBRES' : 'TV 2 - ZONA MÁQUINAS';

    let mediaUnlocked = false;

    document.getElementById('audioUnlocker').addEventListener('click', () => {
      mediaUnlocked = true;
      document.getElementById('audioUnlocker').style.display = 'none';
      if (videoPlayer.src) {
        videoPlayer.play().catch(e => console.log('Iniciando reproductor...'));
      }
    });

    // Pasar a la siguiente canción al terminar el video
    videoPlayer.addEventListener('ended', () => {
      socket.emit('song-ended');
    });

    // Actualización de estado en tiempo real
    socket.on('song-changed', (data) => {
      document.getElementById('currentSongTitle').innerText = data.title;
      document.getElementById('songArtist').innerText = data.artist || 'SONANDO EN EL GYM';
      
      if (data.thumbnail) {
        document.getElementById('songThumbnail').src = data.thumbnail;
      }

      if (data.videoUrl) {
        videoPlayer.src = data.videoUrl;
        if (mediaUnlocked) {
          videoPlayer.play().catch(err => console.error('Error de reproducción:', err));
        }
      } else {
        videoPlayer.removeAttribute('src');
      }
    });

    socket.on('update-music-queue', (queue) => {
      const queueList = document.getElementById('musicQueueList');
      queueList.innerHTML = '';

      if (queue.length === 0) {
        queueList.innerHTML = '<li class="queue-item">No hay canciones en cola</li>';
        return;
      }

      queue.forEach((song) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerText = `🎵 ${song.url}`;
        queueList.appendChild(li);
      });
    });
  </script>
</body>
</html>
