<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nealtican Gym - Control Móvil</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
  <header>
    <div class="brand">NEALTICAN GYM</div>
    <div class="tv-badge">MÓVIL</div>
  </header>

  <main style="max-width: 500px; margin: 0 auto; width: 100%;">
    <!-- Panel Agregar Canción -->
    <div class="neu-panel">
      <h2 style="color: var(--accent-yellow); margin-bottom: 15px; font-size: 1.2rem;">🎵 Agregar Música</h2>
      
      <form id="musicForm" onsubmit="sendSong(event)">
        <div style="margin-bottom: 15px;">
          <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">
            Enlace de YouTube:
          </label>
          <input 
            type="url" 
            id="youtubeUrl" 
            class="neu-inset" 
            placeholder="https://youtu.be/..." 
            required 
          />
        </div>

        <button type="submit" class="neu-button">
          Añadir a la Fila
        </button>
      </form>
    </div>

    <!-- Panel Cola de Espera -->
    <div class="neu-panel">
      <div class="queue-title">Próximas Canciones</div>
      <ul class="queue-list" id="mobileQueueList">
        <li class="queue-item">Cargando cola...</li>
      </ul>
    </div>
  </main>

  <script>
    const socket = io();

    function sendSong(event) {
      event.preventDefault();
      const urlInput = document.getElementById('youtubeUrl');
      const url = urlInput.value.trim();

      if (url) {
        socket.emit('add-song', { url: url });
        urlInput.value = '';
        alert('¡Canción enviada!');
      }
    }

    socket.on('update-music-queue', (queue) => {
      const queueList = document.getElementById('mobileQueueList');
      queueList.innerHTML = '';

      if (queue.length === 0) {
        queueList.innerHTML = '<li class="queue-item">No hay canciones pendientes</li>';
        return;
      }

      queue.forEach((song, index) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerText = `${index + 1}. 🎵 ${song.url}`;
        queueList.appendChild(li);
      });
    });
  </script>
</body>
</html>
