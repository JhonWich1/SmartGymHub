<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nealtican Gym - Control Móvil</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body style="overflow-y: auto;">
  <header>
    <div class="brand">NEALTICAN GYM</div>
    <div class="tv-badge">MÓVIL</div>
  </header>

  <main style="max-width: 480px; margin: 0 auto; width: 100%;">
    <!-- Formulario Agregar Música -->
    <div class="neu-panel" style="margin-bottom: 20px;">
      <h2 style="color: var(--accent-yellow); margin-bottom: 12px; font-size: 1.1rem;">🎵 Agregar Música</h2>
      
      <form id="musicForm" onsubmit="sendSong(event)">
        <input 
          type="url" 
          id="youtubeUrl" 
          class="neu-inset" 
          placeholder="Pega el enlace de YouTube aquí..." 
          required 
        />
        <button type="submit" class="neu-button">Añadir a la Fila</button>
      </form>
    </div>

    <!-- Lista de Canciones en Espera -->
    <div class="neu-panel">
      <div class="queue-title">
        <span>Próximas Canciones</span>
      </div>
      <ul class="queue-list" id="mobileQueueList">
        <li style="color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No hay canciones pendientes</li>
      </ul>
    </div>
  </main>

  <script>
    const socket = io();

    function sendSong(event) {
      event.preventDefault();
      const urlInput = document.getElementById('youtubeUrl');
      const url = urlInput.value.trim();

      if (url) {
        socket.emit('add-song', { url: url });
        urlInput.value = '';
      }
    }

    socket.on('update-music-queue', (queue) => {
      const queueList = document.getElementById('mobileQueueList');
      queueList.innerHTML = '';

      if (queue.length === 0) {
        queueList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No hay canciones pendientes</li>';
        return;
      }

      queue.forEach((song, index) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerHTML = `
          <img class="queue-thumb" src="${song.thumbnail || 'https://via.placeholder.com/40'}" alt="thumb" />
          <div class="queue-info">
            <div class="queue-song-title">${index + 1}. ${song.title}</div>
            <div class="queue-song-artist">${song.artist}</div>
          </div>
        `;
        queueList.appendChild(li);
      });
    });
  </script>
</body>
</html>
